<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B2340">
<meta name="description" content="Lawris: hukuk temalı düşen blok bulmaca oyunu.">
<title>Lawris</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="box"><span class="lbl">İçtihat puanı</span><b id="score">0</b><span class="sub">En iyi: <span id="best">0</span></span></div>
    <div class="box"><span class="lbl">Mahkeme</span><b id="level">Sulh</b><span class="sub" id="status"></span></div>
    <div class="box" id="nextBox"><span class="lbl">Sıradaki dava</span><canvas id="next" width="64" height="64"></canvas><span class="sub" id="swap" hidden>dokun: değiştir</span></div>
    <button id="pauseBtn" aria-label="Duraklat">II</button>
    <button id="muteBtn" aria-label="Müziği kapat" aria-pressed="true">♪</button>
  </header>
  <main id="stage">
    <canvas id="board"></canvas>
    <div id="flash">Hüküm!</div>
    <div id="toast"></div>
    <section id="menu" class="overlay">
      <h1>LAWRIS</h1>
      <p>Davaları istifle, satırlara hüküm ver.</p>
      <button id="play" class="big">Oyna</button>
      <p class="small">Klavye: ← → hareket, ↑/X döndür, ↓ yavaş in, Boşluk düşür, P duraklat</p>
      <a href="privacy.html">Gizlilik</a>
    </section>
    <section id="pause" class="overlay" hidden>
      <h2>Duraklatıldı</h2>
      <button id="resume" class="big">Devam</button>
    </section>
    <section id="over" class="overlay" hidden>
      <h2>Dava düştü</h2>
      <p>İçtihat puanı: <b id="final">0</b></p>
      <p>En iyi: <b id="finalBest">0</b></p>
      <button id="again" class="big">Tekrar oyna</button>
    </section>
  </main>
  <nav id="pad">
    <div class="grp">
      <button data-act="left" aria-label="Sol"><i>◀</i></button>
      <button data-act="down" aria-label="Aşağı"><i>▼</i></button>
      <button data-act="right" aria-label="Sağ"><i>▶</i></button>
    </div>
    <div class="grp">
      <button data-act="drop" aria-label="Düşür"><i>⤓</i></button>
      <button data-act="rotate" class="rot" aria-label="Döndür"><i>⟳</i></button>
    </div>
  </nav>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
